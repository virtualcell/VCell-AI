services:
  ### Vector DB (Qdrant)
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant-vcell
    ports:
      - "6333:6333"     # REST API
      - "6334:6334"     # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  ### LiteLLM Proxy (OpenAI-compatible LLM gateway)
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-vcellai
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      # Gemini only: mount your gcloud Application Default Credentials so the
      # gemini-model alias can authenticate to Vertex AI outside the cluster.
      # Pair with GOOGLE_APPLICATION_CREDENTIALS in litellm.env. Create the file
      # first with `gcloud auth application-default login`, or compose will
      # mount an empty directory in its place.
      # - ~/.config/gcloud/application_default_credentials.json:/etc/gcp/adc.json:ro
    env_file:
      - ./litellm.env
    command: --config /app/config.yaml
    restart: unless-stopped

  ### Backend (FastAPI with Poetry)
  backend:
    build: ./backend
    container_name: vcell-backend
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app 
    command: ["sh", "-c", "poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - ./backend/.env

  ### Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-vcell
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env

volumes:
  qdrant-data:
    driver: local