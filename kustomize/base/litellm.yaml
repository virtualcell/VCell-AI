# Dedicated identity for the proxy. This exists so GCP Workload Identity
# Federation can be scoped to *this* workload: the WIF provider's attribute
# condition pins assertion.sub to "system:serviceaccount:<ns>:litellm", so the
# namespace default SA (which every other pod here uses) cannot assume the
# Google service account. See docs/gcp-wif-findings.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  labels:
    app: litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      serviceAccountName: litellm
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config.yaml"]
          ports:
            - containerPort: 4000
          # Non-secret config (local-model alias + api_base, Langfuse host) comes
          # from the litellm-config ConfigMap generated per-environment.
          envFrom:
            - configMapRef:
                name: litellm-config
          # Secrets come from the sealed "litellm-secrets" secret.
          env:
            # Don't publish the API surface. These are three separate switches in
            # LiteLLM (_get_docs_url/_get_redoc_url/_get_openapi_url) — NO_DOCS
            # alone only hides Swagger and leaves ReDoc + the full openapi.json
            # (500+ paths) readable. Values are parsed by str_to_bool(), which
            # recognizes only "true"/"false" — "1" would silently leave docs on.
            - name: NO_DOCS
              value: "True"
            - name: NO_REDOC
              value: "True"
            - name: NO_OPENAPI
              value: "True"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            # Provide a key for EITHER provider (or both); see litellm_config.yaml.
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: azure-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: openai-api-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: langfuse-secret-key
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: langfuse-public-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: database-url
          volumeMounts:
            - name: litellm-config-file
              mountPath: /app/config.yaml
              subPath: config.yaml
            # The external-account config that vertex_credentials points at. It
            # holds no key material -- only the pool/provider path, the target
            # Google service account, and where to read the token -- so it rides
            # in the same ConfigMap as config.yaml rather than a sealed secret.
            - name: litellm-config-file
              mountPath: /etc/gcp/wif.json
              subPath: gcp-wif.json
            - name: gcp-token
              mountPath: /var/run/secrets/gcp
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              # LiteLLM runs Prisma migrate + the proxy at startup, which spikes
              # well past 1Gi (was getting OOMKilled/137). 2Gi gives headroom.
              memory: "2Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: litellm-config-file
          configMap:
            name: litellm-config-file
        # Short-lived, audience-scoped ServiceAccount token -- the credential we
        # trade at Google's STS for a Vertex AI access token. kubelet rotates the
        # file at ~80% of its lifetime and google-auth re-reads it on refresh, so
        # nothing here expires. This replaces a downloadable service account key,
        # which org policy iam.managed.disableServiceAccountKeyCreation forbids.
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  # REPLACE_ME: the WIF provider's full resource audience, once
                  # Burwood creates the pool (REQ0040169).
                  #
                  # The leading "https://" is deliberate and is NOT a typo to be
                  # tidied up: Google's manifest uses the https:// form here, while
                  # gcp-wif.json uses the schemeless "//iam.googleapis.com/..." form
                  # for the same provider. Both are default allowed audiences.
                  audience: https://iam.googleapis.com/projects/637433805721/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
                  expirationSeconds: 3600
                  path: token
      imagePullSecrets:
        - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  ports:
    - name: "4000"
      port: 4000
      targetPort: 4000
  selector:
    app: litellm
